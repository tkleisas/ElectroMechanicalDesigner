name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore EMD.slnx
      - name: Format check
        run: dotnet format EMD.slnx --verify-no-changes --no-restore
      - name: Test
        run: dotnet test EMD.slnx --nologo --no-restore

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install --upgrade jsonschema
      - name: Validate schemas and fixtures
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft7Validator

          schema = json.load(open("schema/emd-project.schema.json", encoding="utf-8"))
          Draft7Validator.check_schema(schema)
          example = json.load(open("examples/project.json", encoding="utf-8"))
          Draft7Validator(schema).validate(example)

          manifest_schema = json.load(open("schema/cad-manifest.schema.json", encoding="utf-8"))
          Draft7Validator.check_schema(manifest_schema)
          manifest = json.load(open("tests/EMD.Core.Tests/Fixtures/freecad_manifest.json", encoding="utf-8"))
          Draft7Validator(manifest_schema).validate(manifest)
          print("schemas and fixtures are valid")
          PY
      - name: Python adapter tests
        run: |
          cd adapters/python
          python -m unittest discover -s . -p 'test_*.py'
          python -m py_compile freecad_adapter.py emd_cad_manifest.py
          python -m py_compile ../../tools/mechmaker_fmu/mechmaker_slave.py ../../tools/mechmaker_fmu/verify_fmpy.py
