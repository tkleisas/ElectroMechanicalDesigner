name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore EMD.slnx
      - name: Format check
        run: dotnet format EMD.slnx --verify-no-changes --no-restore
      - name: Test
        run: dotnet test EMD.slnx --nologo --no-restore

  fmu-ssp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tkleisas/MechMaker
          ref: 54e76b55c82f6ab82e647447d56d874e81804172
          path: MechMaker
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install co-simulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          python -m pip install pythonfmu==0.7.0 fmpy==0.3.32 omsimulator==3.0.0.post198
      - name: Verify FreeCAD/KiCad imports and firmware bindings
        run: python tools/mechmaker_fmu/verify_imports.py
      - name: Verify OMSimulator parameter bindings
        run: python tools/mechmaker_fmu/verify_omsim.py
      - name: Build self-contained MechMaker FMU
        env:
          MECHMAKER_DIR: ${{ github.workspace }}/MechMaker
        run: tools/mechmaker_fmu/build.sh
      - name: Run SSP integration test
        run: python tools/mechmaker_fmu/verify_ssp.py
      - name: Run SPICE FMU integration test
        run: python tools/spice_fmu/verify_spice_fmu.py

  fmu-direct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tkleisas/MechMaker
          ref: 54e76b55c82f6ab82e647447d56d874e81804172
          path: MechMaker
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NativeAOT dependencies
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Install co-simulation tools
        run: python -m pip install pythonfmu==0.7.0 fmpy==0.3.32 omsimulator==3.0.0.post198
      - name: Build direct NativeAOT FMU
        env:
          MECHMAKER_DIR: ${{ github.workspace }}/MechMaker
          PYTHON: python
        run: tools/mechmaker_fmu/build_direct.sh
      - name: Run SSP integration test with direct FMU
        run: python tools/mechmaker_fmu/verify_ssp.py --mechmaker-fmu tools/mechmaker_fmu/MechMakerDirect.fmu
      - name: Verify direct FMU in OMSimulator
        run: python tools/mechmaker_fmu/verify_omsim.py --mechmaker-fmu tools/mechmaker_fmu/MechMakerDirect.fmu
      - name: Run machine fixture coverage
        run: python tools/mechmaker_fmu/verify_machines.py --mechmaker-dir "${{ github.workspace }}/MechMaker"
      - name: Build proxy FMU for parity
        env:
          MECHMAKER_DIR: ${{ github.workspace }}/MechMaker
        run: tools/mechmaker_fmu/build.sh
      - name: Compare direct and proxy FMUs
        run: python tools/mechmaker_fmu/verify_parity.py --mechmaker-dir "${{ github.workspace }}/MechMaker"

  fmu-direct-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tkleisas/MechMaker
          ref: 54e76b55c82f6ab82e647447d56d874e81804172
          path: MechMaker
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install co-simulation tools
        run: python -m pip install pythonfmu==0.7.0 fmpy==0.3.32
      - name: Build direct NativeAOT FMU (Windows)
        shell: bash
        env:
          MECHMAKER_DIR: ${{ github.workspace }}/MechMaker
        run: tools/mechmaker_fmu/build_direct.sh
      - name: Run SSP integration test with Windows FMU
        run: python tools/mechmaker_fmu/verify_ssp.py --mechmaker-fmu tools/mechmaker_fmu/MechMakerDirect.fmu
      - name: Run machine fixture coverage on Windows
        run: python tools/mechmaker_fmu/verify_machines.py --mechmaker-dir "${{ github.workspace }}/MechMaker"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deterministic CI image
        run: docker build -f docker/ci.Dockerfile -t emd-ci .
      - name: Run tests in the container
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e NUGET_PACKAGES=/tmp/nuget -v "${{ github.workspace }}:/work" -w /work emd-ci bash docker/ci-smoke.sh

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install --upgrade jsonschema
      - name: Validate schemas and fixtures
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft7Validator

          schema = json.load(open("schema/emd-project.schema.json", encoding="utf-8"))
          Draft7Validator.check_schema(schema)
          example = json.load(open("examples/project.json", encoding="utf-8"))
          Draft7Validator(schema).validate(example)

          manifest_schema = json.load(open("schema/cad-manifest.schema.json", encoding="utf-8"))
          Draft7Validator.check_schema(manifest_schema)
          manifest = json.load(open("tests/EMD.Core.Tests/Fixtures/freecad_manifest.json", encoding="utf-8"))
          Draft7Validator(manifest_schema).validate(manifest)

          path_schema = json.load(open("schema/path-job.schema.json", encoding="utf-8"))
          Draft7Validator.check_schema(path_schema)
          path_job = json.load(open("tests/EMD.Core.Tests/Fixtures/path_job.json", encoding="utf-8"))
          Draft7Validator(path_schema).validate(path_job)
          print("schemas and fixtures are valid")
          PY
      - name: Python adapter tests
        run: |
          cd adapters/python
          python -m unittest discover -s . -p 'test_*.py'
          python -m py_compile freecad_adapter.py emd_cad_manifest.py
          cd ../../tools/cadquery
          python -m unittest discover -s . -p 'test_*.py'
          python -m py_compile generate_parts.py
          python -m py_compile ../../tools/mechmaker_fmu/mechmaker_slave.py ../../tools/mechmaker_fmu/verify_fmpy.py ../../tools/mechmaker_fmu/command_slave.py ../../tools/mechmaker_fmu/verify_ssp.py ../../tools/mechmaker_fmu/verify_imports.py ../../tools/mechmaker_fmu/verify_omsim.py ../../tools/mechmaker_fmu/verify_machines.py ../../tools/mechmaker_fmu/verify_parity.py ../../tools/spice_fmu/verify_spice_fmu.py ../../tools/renode/verify_renode.py
